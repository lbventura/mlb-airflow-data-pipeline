[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlb-airflow-data-pipeline"
version = "0.0.1"
requires-python = "==3.14.7"
dependencies = [
    "matplotlib==3.11.2",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "pydantic==2.13.5",
    "pytest==9.1.1",
    "MLB-StatsAPI==1.9.0",
    "apache-airflow==3.3.2",
    "structlog>=26.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mlb_airflow_data_pipeline*"]
